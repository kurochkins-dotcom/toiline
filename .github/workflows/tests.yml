# Проверки на каждый PR и пуш в main: необъявленные имена и test_toi.py на живом сервере
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # как в Dockerfile
      - name: Необъявленные имена в коде
        run: |
          pip install -q pyflakes==3.2.0
          ! python -m pyflakes *.py | grep "undefined name"
      - name: Тест сервера
        env:
          PORT: "8123"
          DATA_DIR: ${{ runner.temp }}/toi-data
          ADMIN_KEY: testadmin
        run: |
          python server.py > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8123/health && break; sleep 1; done
          BASE=http://127.0.0.1:8123 ADMIN_KEY=testadmin python test_toi.py
      - name: Лог сервера при ошибке
        if: failure()
        run: cat server.log || true
