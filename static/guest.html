<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1EA">
<title>Toi Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Playfair+Display:ital@0;1&family=Noto+Serif+Display:wght@200;300&family=Prata&family=Pinyon+Script&family=Petit+Formal+Script&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/toi.css">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scr{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:20px 24px calc(28px + env(safe-area-inset-bottom))}
.lang{align-self:flex-end;display:flex;gap:4px}
.lang button{height:32px;padding:0 10px;border-radius:16px;border:1px solid color-mix(in srgb,var(--muted) 45%,transparent);background:transparent;font:600 12px Montserrat,sans-serif}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero{margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.hero .kind{font-family:'Toi Great Vibes',cursive;font-size:30px;color:var(--accent)}
.hero h1{margin:0;font-weight:300;line-height:1.1}
.hero .rule{width:56px;height:1px;background:var(--accent)}
.hero .date{font-size:12px;letter-spacing:.45em;color:var(--muted)}
.hello{margin:40px 0 0;text-align:center;font-family:'Cormorant Garamond',serif;font-size:21px;line-height:1.35;color:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.acts{margin-top:auto;padding-top:28px;display:flex;flex-direction:column;gap:12px}
.act{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:10px 12px 10px 22px;border-radius:32px;border:1px solid color-mix(in srgb,var(--muted) 35%,transparent);background:color-mix(in srgb,#fff 70%,var(--bg));text-align:left;color:var(--ink)}
.dark .act{background:color-mix(in srgb,#fff 6%,var(--bg))}
.act span.t{display:flex;flex-direction:column;gap:2px}
.act b{font-weight:600;font-size:16px}
.act small{font-size:12px;color:var(--muted)}
.act i{flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;border:1px solid var(--accent);font:600 12px Montserrat,sans-serif;font-style:normal;color:var(--accent)}
.act.prem{border:0;background:linear-gradient(100deg,#2A2622,#4A3F33);color:#F5F1EA}
.act.prem small{color:#E2D3B4}
.act.prem i{border:0;background:linear-gradient(135deg,#E6CD95,#B08D4E);color:#2A2622}
.brand{text-align:center;font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.06em}
.fine{text-align:center;font-size:11.5px;color:var(--muted);margin:2px 6px 0;line-height:1.4}
/* шапка шага */
.bar{display:flex;align-items:center;gap:12px}
.back{width:44px;height:44px;border-radius:22px;border:1px solid color-mix(in srgb,var(--muted) 45%,transparent);background:transparent;font-size:18px;line-height:1;display:grid;place-items:center}
.bar .ttl{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:.06em}
.badge{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:14px;padding:5px 10px;white-space:nowrap}
/* бесплатное: полароид */
.polwrap{align-self:center;margin:20px 0 6px;position:relative}
.pol.g{width:250px;padding:12px 12px 0;transform:rotate(-2deg);cursor:pointer;border:0;display:block}
.pol.g .ph{width:226px;height:250px;font-size:12px}
.pol.g .cap{height:62px;display:flex;align-items:center;justify-content:center;color:#2A2622;font-size:26px;line-height:1;overflow:hidden;white-space:nowrap}
.pol.g .hint{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:#6E665C;font-size:13px;font-weight:500}
.pol.g .hint svg{width:34px;height:34px}
.redo{position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.88);font-size:18px;color:#2A2622;z-index:2}
.flds{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.fld em{font-style:normal;font-weight:400}
.fld input,.fld textarea{height:48px;border-radius:12px;border:1px solid color-mix(in srgb,var(--muted) 40%,transparent);background:color-mix(in srgb,#fff 80%,var(--bg));padding:0 14px;font:400 16px Montserrat,sans-serif;color:var(--ink)}
.fld textarea{height:84px;padding:12px 14px;resize:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid color-mix(in srgb,var(--muted) 35%,transparent);background:transparent;border-radius:99px;padding:6px 11px;font-size:12.5px;color:var(--ink)}
.go{margin-top:auto;height:58px;border-radius:29px;border:0;background:var(--ink);color:var(--bg);font:600 16px Montserrat,sans-serif;width:100%}
.go:disabled{opacity:.6}
.spacer{flex:1;min-height:18px}
.err{color:#B3261E;font-size:13px;margin:8px 0 0;text-align:center}
/* Premium: тёмная страница-открытка, без шапки праздника */
.prem-page{background:#1E1B19;color:#F5F1EA;--muted:#BDB3A6;--ink:#F5F1EA}
.prem-page .back{border-color:#4A433C}
.prem-page .badge{color:#1E1B19;background:linear-gradient(135deg,#E6CD95,#B08D4E);border:0}
.fstage{align-self:center;margin:14px 0 4px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.fstage .frm{filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))}
.fstage .cap{font-family:'Toi Comforter',cursive;font-size:28px;line-height:1.1;text-align:center;min-height:30px}
.frames{display:flex;gap:8px;justify-content:center;margin-top:8px}
.frames button{height:44px;padding:0 10px;white-space:nowrap;border-radius:22px;border:1px solid #4A433C;background:transparent;color:#F5F1EA;font:500 13px Montserrat,sans-serif;display:flex;align-items:center;gap:8px}
.frames button img{width:16px;height:22px;object-fit:contain}
.frames button[aria-pressed="true"]{border-color:#E6CD95;background:rgba(230,205,149,.14);color:#F1DDA8;font-weight:600}
.two{display:flex;gap:8px;margin-top:12px}
.two button{flex:1;height:44px;border-radius:12px;border:1px solid #4A433C;background:transparent;color:#F5F1EA;font:500 13px Montserrat,sans-serif}
.prem-page .fld input,.prem-page .fld textarea{background:#2A2622;border-color:#4A433C;color:#F5F1EA}
.sums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sums button{height:44px;border-radius:12px;border:1px solid #4A433C;background:transparent;color:#F5F1EA;font:500 13px Montserrat,sans-serif}
.sums button[aria-pressed="true"]{border-color:#E6CD95;background:rgba(230,205,149,.14);color:#F1DDA8;font-weight:600}
.go.gold{background:linear-gradient(100deg,#E6CD95,#B08D4E);color:#1E1B19;margin-top:18px}
/* Kaspi */
.kbox{margin-top:20px;display:grid;gap:12px;justify-items:center;text-align:center;padding:22px 18px;border-radius:20px;background:#2A2622;border:1px solid #4A433C}
.kbox .k{width:52px;height:52px;border-radius:14px;background:#F14635;color:#fff;font:700 26px Montserrat,sans-serif;display:grid;place-items:center}
.kbox .to{font-size:14px;color:#BDB3A6}
.kbox .to b{color:#F5F1EA;font-size:16px}
.kbox .sumv{font-family:'Cormorant Garamond',serif;font-size:44px;line-height:1;background:linear-gradient(100deg,#F1DDA8,#B08D4E);-webkit-background-clip:text;background-clip:text;color:transparent}
.kbox .phone{display:flex;gap:8px;align-items:center;font-weight:600;font-size:17px}
.kbox .phone button{border:1px solid #4A433C;background:transparent;color:#F5F1EA;border-radius:10px;padding:6px 10px;font-size:12px}
.kbox ol{margin:0;padding-left:20px;text-align:left;font-size:13.5px;color:#D9D0C3;display:grid;gap:4px}
.go.kaspi{background:#F14635;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:14px}
/* готово */
.done{margin:auto 0;text-align:center;display:grid;gap:12px;justify-items:center}
.done .ok{width:72px;height:72px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--accent)}
.done h3{margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;line-height:1.15}
.done p{margin:0;color:var(--muted);max-width:320px}
.loading{margin:auto;color:var(--muted);text-align:center}
</style>
</head>
<body>
<input id="fFile" type="file" accept="image/*" hidden>
<input id="fSelfie" type="file" accept="image/*" capture="user" hidden>

<div class="scr" id="vLoad"><div class="loading" data-t="loading"></div></div>

<div class="scr" id="vHome" hidden>
  <div class="lang" role="group" aria-label="Тіл / Язык"><button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button></div>
  <div class="hero"><div class="kind" id="hKind"></div><h1 id="hNames"></h1><div class="rule"></div><div class="date" id="hDate"></div></div>
  <p class="hello" id="hello"></p>
  <div class="acts">
    <button class="act" data-go="free"><span class="t"><b data-t="free"></b><small data-t="freeSub" id="freeSub"></small></span><i data-t="sec10"></i></button>
    <button class="act prem" data-go="prem" id="premBtn"><span class="t"><b data-t="prem"></b><small data-t="premSub"></small></span><i data-t="min1"></i></button>
    <p class="err" id="homeErr" hidden></p>
    <div class="brand">Toi Line</div>
  </div>
</div>

<div class="scr" id="vFree" hidden>
  <div class="bar"><button class="back" data-go="home" aria-label="Назад">‹</button><div class="ttl" data-t="free"></div><span class="badge" data-t="onScreen10"></span></div>
  <div class="polwrap">
    <button class="pol g" id="fPol" type="button"><div class="ph film-warm" id="fPh"><div class="hint" id="fHint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span data-t="takeSelfie"></span></div></div><div class="cap" id="fCap" style="font-family:'Toi Great Vibes',cursive"></div></button>
    <button class="redo" id="fRedo" type="button" aria-label="Переснять" hidden>↻</button>
  </div>
  <div class="flds">
    <label class="fld"><span data-t="yourName"></span><input type="text" id="fName" maxlength="30" autocomplete="name"></label>
    <label class="fld"><span><span data-t="wish"></span> <em data-t="optional"></em></span><textarea id="fMsg" maxlength="140"></textarea></label>
    <div class="chips" id="fQuick"></div>
  </div>
  <div class="spacer"></div>
  <button class="go" id="fSend" data-t="toScreen"></button>
  <p class="err" id="fErr" hidden></p>
</div>

<div class="scr prem-page" id="vPrem" hidden>
  <div class="bar"><button class="back" data-go="home" aria-label="Назад">‹</button><span class="badge" data-t="onScreen60"></span></div>
  <div class="fstage"><div id="pFrame"></div><div class="cap" id="pCap"></div></div>
  <div class="frames" id="pFrames"></div>
  <div class="two"><button type="button" data-pick="fFile" data-t="upload"></button><button type="button" data-pick="fSelfie" data-t="selfie"></button></div>
  <div class="flds">
    <label class="fld"><span data-t="fromWhom"></span><input type="text" id="pName" maxlength="30" autocomplete="name"></label>
    <label class="fld"><span data-t="wish"></span><input type="text" id="pMsg" maxlength="140"></label>
    <div class="fld"><span data-t="sum"></span>
      <div class="sums" id="pSums"><button data-s="5000">5 000</button><button data-s="10000" aria-pressed="true">10 000</button><button data-s="20000">20 000</button><button data-s="own" data-t="other"></button></div>
      <input type="number" id="pOwn" min="500" step="500" inputmode="numeric" hidden></div>
  </div>
  <button class="go gold" id="pSend"></button>
  <p class="err" id="pErr" hidden></p>
</div>

<div class="scr prem-page" id="vPay" hidden>
  <div class="bar"><button class="back" data-go="prem" aria-label="Назад">‹</button><div class="ttl">Kaspi</div></div>
  <div class="kbox">
    <div class="k">K</div>
    <div class="to"><span data-t="payTo"></span><br><b id="kName"></b></div>
    <div class="sumv" id="kSum"></div>
    <div class="phone" id="kPhoneRow"><span id="kPhone"></span><button id="kCopy" type="button" data-t="copy"></button></div>
    <ol id="kSteps"></ol>
  </div>
  <a class="go kaspi" id="kOpen" href="#" target="_blank" rel="noopener" hidden data-t="openKaspi"></a>
  <button class="go gold" id="kDone" data-t="iPaid"></button>
  <p class="err" id="kErr" hidden></p>
  <p class="fine" data-t="payFine"></p>
</div>

<div class="scr" id="vDone" hidden>
  <div class="done"><div class="ok" id="dIco">✓</div><h3 id="dT"></h3><p id="dP"></p>
    <button class="go" data-go="home" style="margin-top:14px;max-width:320px" data-t="again"></button></div>
</div>

<script src="/static/common.js"></script>
<script>
(function(){

const eid=location.pathname.split('/')[2];
const table=(new URLSearchParams(location.search).get('t')||'').replace(/[^0-9a-zA-Zа-яА-Я-]/g,'').slice(0,6);
const L={
  kk:{loading:'Той жүктелуде…',notFound:'Той табылмады. Сілтемені немесе QR-кодты тексеріңіз.',free:'Құттықтау',freeSub:'тегін · селфи және есім',prem:'Премиум құттықтау',premSub:'рамкадағы фото · Kaspi арқылы сыйлық',sec10:'10с',min1:'1 мин',
    onScreen10:'экранда 10 с',onScreen60:'экранда 1 минут',takeSelfie:'Селфи түсіру',yourName:'Есіміңіз',wish:'Тілек',optional:'(міндетті емес)',toScreen:'Экранға жіберу',upload:'Сурет жүктеу',selfie:'Селфи түсіру',

    dShown:'Құттықтауыңыз экранда!',dShownP:'Рақмет! Тойдан кейін ол құттықтаулар альбомына түседі.',dHidden:'Модератор құттықтауды өткізбеді',dHiddenP:'Басқа құттықтау жіберуге болады.',dHiddenEnvP:'Той иесі аударымды қайтарады.',

    onScreen10:'на экране 10 с',onScreen60:'на экране 1 минуту',takeSelfie:'Сделать селфи',yourName:'Ваше имя',wish:'Пожелание',optional:'(необязательно)',toScreen:'Отправить на экран',upload:'Загрузить фото',selfie:'Сделать селфи',
    fromWhom:'От кого',sum:'Сумма подарка',other:'Другая',send:'Отправить',payTo:'Переведите организатору тоя',copy:'Скопировать',copied:'Скопировано',openKaspi:'Открыть Kaspi',iPaid:'Я перевёл(а), отправить',

let lang='kk';try{lang=localStorage.getItem('toi-lang')||'kk';}catch(e){}

}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;lang=b.dataset.lang;try{localStorage.setItem('toi-lang',lang);}catch(x){}i18n();});

/* Бесплатное — раз в 30 минут с устройства (то же правило на сервере); здесь только подсказка */
const FREE_EVERY=30*60*1000,freeKey='toi-free-'+eid;
function freeLeft(){try{const v=+localStorage.getItem(freeKey)||0;return Math.max(0,v+FREE_EVERY-Date.now());}catch(x){return 0;}}
function blockFree(at){try{localStorage.setItem(freeKey,String(at||Date.now()));}catch(x){}}
function freeNote(){const l=freeLeft();$('freeSub').textContent=l?t('freeIn')(Math.ceil(l/60000)):t('freeSub');if(!l)$('homeErr').hidden=true;}

function go(v){
  if(v==='free'&&freeLeft()){return err('homeErr',t('freeWait')(Math.ceil(freeLeft()/60000)));}
  view=v;['vLoad','vHome','vFree','vPrem','vPay','vDone'].forEach(id=>$(id).hidden=true);
  $({home:'vHome',free:'vFree',prem:'vPrem',pay:'vPay',done:'vDone'}[v]).hidden=false;
  document.querySelector('meta[name=theme-color]').content=(v==='prem'||v==='pay')?'#1E1B19':T.palOf(raw).bg;
  if(v==='home')freeNote();if(v==='free')updFree();if(v==='prem')updPrem();
  ['fErr','pErr','kErr'].forEach(id=>$(id).hidden=true);scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);});
function err(id,s){$(id).textContent=s;$(id).hidden=false;}

/* ---------- фото ---------- */
async function onFile(e){const f=e.target.files[0];e.target.value='';if(!f)return;
  try{photo=await T.readImg(f,1200,.84);orient=await T.orientOf(photo);}catch(er){photo=null;}
  if(pickFor==='free')updFree();else updPrem();}
$('fFile').addEventListener('change',onFile);$('fSelfie').addEventListener('change',onFile);
$('fPol').addEventListener('click',()=>{pickFor='free';$('fSelfie').click();});
$('fRedo').addEventListener('click',()=>{pickFor='free';$('fSelfie').click();});
document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{pickFor='prem';$(b.dataset.pick).click();}));

/* ---------- бесплатное ---------- */
function updFree(){
  const ph=$('fPh');ph.style.backgroundImage=photo?`url(${photo})`:'';$('fHint').hidden=!!photo;$('fRedo').hidden=!photo;
  ph.className='ph'+(c&&c.film!=='none'?' film-'+(c.film||'warm'):'');
  $('fCap').textContent=$('fName').value.trim()||'';
}
$('fName').addEventListener('input',updFree);
$('fQuick').addEventListener('click',e=>{const b=e.target.closest('button');if(b)$('fMsg').value=b.textContent;});
$('fSend').addEventListener('click',()=>{
  if(!$('fName').value.trim())return err('fErr',t('needName'));
  if(!photo&&!$('fMsg').value.trim())return err('fErr',t('needSome'));
  submit({name:$('fName').value.trim(),msg:$('fMsg').value.trim(),amount:0},'fSend','fErr');
});

/* ---------- Premium ---------- */
$('pFrames').innerHTML=Object.entries(T.FR).map(([k,f])=>`<button type="button" data-f="${k}" aria-pressed="${k===frame}"><img src="/static/img/frame-${k}-v.png" alt="">${f.name}</button>`).join('');
$('pFrames').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;frame=b.dataset.f;updPrem();});
function updPrem(){
  const w=Math.min(320,innerWidth-70),card={name:$('pName').value.trim(),photo,frame};
  $('pFrame').innerHTML=T.frameHTML(card,orient,orient==='h'?w:w*.72,c?c.film:'warm');
  $('pCap').textContent=card.name;
  [...$('pFrames').children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===frame)));
  $('pSend').textContent=t('send')+' · '+T.fmt(amount);
}
$('pName').addEventListener('input',updPrem);
$('pSums').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  [...$('pSums').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  if(b.dataset.s==='own'){$('pOwn').hidden=false;$('pOwn').focus();amount=Math.round(+$('pOwn').value||0);}else{$('pOwn').hidden=true;amount=+b.dataset.s;}updPrem();});
$('pOwn').addEventListener('input',()=>{amount=Math.round(+$('pOwn').value||0);updPrem();});
$('pSend').addEventListener('click',()=>{
  if(!$('pName').value.trim())return err('pErr',t('needName'));
  if(amount<500)return err('pErr',t('minSum'));
  try{localStorage.setItem('toi-name',$('pName').value.trim());}catch(x){}
  $('kSum').textContent=T.fmt(amount);$('kName').textContent=c.kaspi_name||'';
  $('kPhone').textContent=c.kaspi_phone||'';$('kPhoneRow').hidden=!c.kaspi_phone;
  $('kOpen').hidden=!c.kaspi_link;if(c.kaspi_link)$('kOpen').href=c.kaspi_link;
  const steps=c.demo?[t('stepDemo')]:[c.kaspi_link?t('stepOpen'):t('stepPhone'),t('stepSum')(T.fmt(amount)),t('stepBack')];
  if(c.demo)$('kPhoneRow').hidden=true;
  $('kSteps').innerHTML=steps.map(s=>`<li>${T.esc(s)}</li>`).join('');go('pay');
});
$('kCopy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText((c.kaspi_phone||'').replace(/[^\d+]/g,''));$('kCopy').textContent=t('copied');}catch(e){}});
$('kDone').addEventListener('click',()=>submit({name:$('pName').value.trim(),msg:$('pMsg').value.trim(),amount,frame},'kDone','kErr'));

/* ---------- отправка ---------- */
async function submit(body,btn,errId){
  if(sending)return;sending=true;const b=$(btn),old=b.textContent;b.disabled=true;b.textContent=t('sending');
  try{
    try{localStorage.setItem('toi-name',body.name);}catch(x){}
    const r=await T.api(`/api/e/${eid}/card`,{...body,table,photo:photo||''});
    photo=null;orient='v';if(!body.amount){blockFree();$('fMsg').value='';}
    done(body.amount,r.status,r.pos);watch(r.id,r.token,body.amount);
  }catch(e){
    if(e.retry)blockFree(Date.now()-(FREE_EVERY-e.retry*1000));
    err(errId,e.message||'Error');
  }finally{sending=false;b.disabled=false;b.textContent=old;}
}
function done(vip,status,pos){
  let ico='✓',h='',p='';
  if(status==='pending'){h=t(vip?'dEnvSent':'dSent');p=t(vip?'dEnvSentP':'dSentP');}
  else if(status==='approved'){h=t('dQueue');p=vip?t('dEnvQueueP'):t('dQueueP')(pos);}
  else if(status==='shown'){ico='★';h=t('dShown');p=t('dShownP');}
  else if(status==='hidden'){ico='×';h=t('dHidden');p=vip?t('dHiddenEnvP'):t('dHiddenP');}
  $('dIco').textContent=ico;$('dT').textContent=h;$('dP').textContent=p;
  if(view!=='done')go('done');
}
function watch(id,token,vip){
  clearInterval(poll);let n=0,last='';
  poll=setInterval(async()=>{
    if(++n>240||view!=='done')return clearInterval(poll);
    try{const r=await T.api(`/api/e/${eid}/card/${id}?token=${token}`);
      const k=r.status+r.pos;if(k!==last){last=k;done(vip,r.status,r.pos);}
      if(r.status==='shown'||r.status==='hidden')clearInterval(poll);}catch(e){}
  },5000);
}

async function load(){
  i18n();
  try{const r=await T.api(`/api/e/${eid}`);raw=r.cfg;c=T.full(r.cfg);}
  catch(e){document.querySelector('#vLoad .loading').textContent=t('notFound');return;}
  T.vars(document.body,raw);
  const f=T.NFONT[c.nfont],[a,b]=T.splitNames(c.names),cap=s=>f.caps?T.up(s):s;
  const h=$('hNames');h.style.cssText=`font-family:${f.fam};font-weight:${f.w===400&&f.caps?300:f.w};font-style:${f.it};letter-spacing:${f.caps?'.12em':f.ls};font-size:${T.fitSize(Math.round(44*f.k),[cap(a),cap(b)],330,f.caps?.8:.5)}px`;
  h.innerHTML=T.esc(cap(a))+(b?'<br>&amp; '+T.esc(cap(b)):'');
  $('hKind').textContent=c.kind||'';$('hDate').textContent=T.niceDate(c.date);
  $('hello').textContent=c.hello||T.PRESETS[c.type].hello;
  document.title=(c.names||'Toi Line')+' · Toi Line';
  $('fQuick').innerHTML=(c.quick||[]).slice(0,4).map(q=>`<button type="button">${T.esc(q)}</button>`).join('');
  try{const n=localStorage.getItem('toi-name')||'';$('fName').value=n;$('pName').value=n;}catch(e){}
  canEnv=!!(c.kaspi_phone||c.kaspi_link||c.demo);$('premBtn').hidden=!canEnv;
  go('home');
}
load();
})();
</script>
</body>
