<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Toi Online · мероприятия</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ui-bg:#101218;--ui-panel:#181b24;--ui-line:#2b3040;--ui-ink:#eceef4;--ui-muted:#959cb0;--ui-accent:#3fb8a9;--gold:#f3d58a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ui-bg);color:var(--ui-ink);font-family:"Manrope",system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:16px}
h1{margin:0;font-size:24px;font-weight:800}
.lead{margin:2px 0 0;color:var(--ui-muted)}
.card{background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:16px;padding:16px;display:grid;gap:12px}
.card h2{margin:0;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--ui-muted);font-weight:600}
.field input,.field select{background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:10px;padding:9px 11px;width:100%}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.types{grid-template-columns:repeat(2,1fr)}}
.type{border:1px solid var(--ui-line);background:var(--ui-bg);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:2px;position:relative;overflow:hidden}
.type::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--sw)}
.type b{font-size:14px;padding-left:4px}.type span{font-size:12px;color:var(--ui-muted);padding-left:4px}
.type[aria-pressed="true"]{border-color:var(--ui-accent);box-shadow:0 0 0 1px var(--ui-accent) inset}
.btn{border:1px solid var(--ui-line);background:var(--ui-bg);border-radius:10px;padding:10px 14px;font-weight:700;text-decoration:none;display:inline-block;text-align:center}
.btn.primary{background:var(--ui-accent);border-color:var(--ui-accent);color:#06201d}
.btn.small{padding:6px 10px;font-size:13px}
.err{color:#ff8a80;font-size:13px;margin:0}
.ev{display:grid;gap:6px;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:12px;padding:12px}
.ev .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ev .h b{font-size:15px}
.ev .h span{font-size:12px;color:var(--ui-muted)}
.ev .row{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--ui-muted)}
.new{border-color:var(--ui-accent)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Toi Online</h1><p class="lead">Живой праздничный экран для тоя. Создайте мероприятие и получите три ссылки: для гостей (QR), для пульта модератора и для LED-экрана.</p></header>

  <div class="card" id="login" hidden>
    <h2>Вход</h2>
    <div class="grid"><div class="field"><label for="key">Ключ администратора</label><input type="password" id="key" autocomplete="current-password"></div>
    <button class="btn primary" id="enter">Войти</button></div>
    <p class="err" id="lErr" hidden></p>
  </div>

  <div id="main" hidden style="display:grid;gap:16px">
    <div class="card">
      <h2>Новый той</h2>
      <div class="types" id="types">
        <button class="type" data-t="wedding" style="--sw:#e7b2c0" aria-pressed="true"><b>Свадьба</b><span>Үйлену тойы</span></button>
        <button class="type" data-t="jubilee" style="--sw:#1d5a4d" aria-pressed="false"><b>Юбилей</b><span>Мерейтой</span></button>
        <button class="type" data-t="uzatu" style="--sw:#6e1430" aria-pressed="false"><b>Қыз ұзату</b><span>Проводы невесты</span></button>
        <button class="type" data-t="tusau" style="--sw:#a9d6ea" aria-pressed="false"><b>Тұсаукесер</b><span>1 годик</span></button>
      </div>
      <div class="grid">
        <div class="field"><label for="names">Главная надпись</label><input type="text" id="names" maxlength="60"></div>
        <div class="field"><label for="date">Дата</label><input type="text" id="date" maxlength="30" placeholder="21 · 11 · 2026"></div>
        <div class="field"><label for="kname">Получатель Kaspi</label><input type="text" id="kname" maxlength="60" placeholder="Диас Е."></div>
        <div class="field"><label for="kphone">Телефон Kaspi организатора</label><input type="tel" id="kphone" maxlength="20" placeholder="+7 7__ ___ __ __"></div>
      </div>
      <div><button class="btn primary" id="create">Создать</button></div>
      <p class="err" id="cErr" hidden></p>
      <p class="note">Шаблон, цвета, шрифт, заставку и пожелания организатор или вы настроите потом во вкладке «Экран» пульта.</p>
    </div>
    <div class="card">
      <h2>Мероприятия</h2>
      <div id="list" style="display:grid;gap:8px"></div>
    </div>
    <div><button class="btn small" id="logout">Выйти</button></div>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
(function(){
const T=TOI,$=T.$,esc=T.esc;
let key='',type='wedding',justMade='';
try{key=localStorage.getItem('toi-admin')||'';}catch(e){}
const H=()=>({'X-Toi-Admin':key});
function show(m){$('login').hidden=m;$('main').hidden=!m;}
async function load(){
  try{const r=await T.api('/api/admin/events',undefined,H());show(true);list(r.events);}
  catch(e){show(false);if(key){$('lErr').textContent=e.message;$('lErr').hidden=false;}}
}
function list(evs){
  $('list').innerHTML=evs.map(e=>`<div class="ev${e.id===justMade?' new':''}"><div class="h"><b>${esc(e.names||'Без названия')}</b><span>${esc(e.kind)} · ${esc(e.date)} · открыток ${e.cards} · конвертов ${T.fmt(e.sum)}</span></div>
    <div class="row"><a class="btn small primary" href="${e.links.mod}" target="_blank">Пульт</a><a class="btn small" href="${e.links.led}" target="_blank">LED-экран</a><a class="btn small" href="${e.links.guest}" target="_blank">Гость</a><a class="btn small" href="${e.links.album}" target="_blank">Альбом</a>
    <button class="btn small" data-copy="${esc(T.abs(e.links.mod))}">Ссылка на пульт</button><button class="btn small" data-del="${e.id}">Удалить</button></div></div>`).join('')||'<div class="note">Пока нет мероприятий.</div>';
}
$('types').addEventListener('click',e=>{const b=e.target.closest('.type');if(!b)return;type=b.dataset.t;[...$('types').children].forEach(x=>x.setAttribute('aria-pressed',x===b));$('names').placeholder=T.PRESETS[type].names;});
$('names').placeholder=T.PRESETS.wedding.names;
$('enter').addEventListener('click',()=>{key=$('key').value.trim();try{localStorage.setItem('toi-admin',key);}catch(e){}load();});
$('key').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click();});
$('logout').addEventListener('click',()=>{key='';try{localStorage.removeItem('toi-admin');}catch(e){}show(false);});
$('create').addEventListener('click',async()=>{
  const p=T.preset(type);p.names=$('names').value.trim()||p.names;p.date=$('date').value.trim();p.kaspi_name=$('kname').value.trim();p.kaspi_phone=$('kphone').value.trim();
  p.sheen='30s';p.moderation=true;
  try{const r=await T.api('/api/admin/events',p,H());justMade=r.id;$('cErr').hidden=true;['names','date','kname','kphone'].forEach(id=>$(id).value='');load();}
  catch(e){$('cErr').textContent=e.message;$('cErr').hidden=false;}
});
document.addEventListener('click',async e=>{
  const c=e.target.closest('[data-copy]');if(c){try{await navigator.clipboard.writeText(c.dataset.copy);c.textContent='Скопировано';}catch(er){}}
  const d=e.target.closest('[data-del]');if(d&&confirm('Удалить мероприятие? Ссылки перестанут работать.')){await T.api(`/api/admin/events/${d.dataset.del}/delete`,{},H()).catch(()=>{});load();}
});
load();
})();
</script>
</body>
</html>
